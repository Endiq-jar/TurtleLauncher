name: Build with LWJGL 3.4.2 native fix

# Manual trigger only - this is a heavier build than the normal Auto Build
# (it cross-compiles LWJGL's native C core for Android arm64 first).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Three separate checkouts side by side:
      #   turtle/    - this repo, where the fixed APK gets built
      #   builder/   - MojoLauncher's build scripts + Android patches for LWJGL
      #   lwjgl3/    - real upstream LWJGL, checked out at the exact tag we need
      - name: Checkout TurtleLauncher
        uses: actions/checkout@v4
        with:
          path: turtle

      - name: Checkout MojoLauncher's LWJGL Android builder
        uses: actions/checkout@v4
        with:
          repository: MojoLauncher/unilwjgl3-builder
          path: builder

      - name: Checkout LWJGL 3.4.2
        uses: actions/checkout@v4
        with:
          repository: LWJGL/lwjgl3
          ref: '3.4.2'
          path: lwjgl3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest ships several JDKs pre-installed; MojoLauncher's own CI
      # points JAVA8_HOME at the pre-installed 8 rather than fetching one -
      # matching that exactly here since their scripts expect it set this way.
      - name: Apply MojoLauncher's Android patches to LWJGL
        working-directory: lwjgl3
        run: |
          set -e
          for p in ../builder/patches/uni/*.diff; do
            echo "Applying $p"; git apply --whitespace=fix "$p"
          done
          for p in ../builder/patches/3.4.2/*.diff; do
            echo "Applying $p"; git apply --whitespace=fix "$p"
          done
          if [ -f modules/lwjgl/core/src/templates/kotlin/core/linux/templates/uio.kt ]; then
            git apply --whitespace=fix ../builder/patches/manual/lwjgl3_droid_syscall.diff
          fi
          if [ -f modules/lwjgl/core/src/main/c/linux/LinuxLWJGL.h ]; then
            git apply --whitespace=fix ../builder/patches/manual/lwjgl3_remove_x11_hdr.diff
          fi

      # Runs MojoLauncher's own, real, already-tested build script rather than
      # a hand-rolled reimplementation of its steps - same script their CI uses.
      - name: Run MojoLauncher's native build script (arm64 + others)
        working-directory: lwjgl3
        env:
          LWJGL_VERSION: '3.4.2'
          LIBFFI_VERSION: '3.7.0'
          JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: bash ../builder/ci_build_all.bash

      - name: Locate the new native libs
        run: |
          set -e
          echo "Searching for liblwjgl.so / liblwjgl_sdl.so under lwjgl3/bin ..."
          find lwjgl3/bin -type f \( -name "liblwjgl.so" -o -name "liblwjgl_sdl.so" \) -print

      - name: Copy arm64 native libs into TurtleLauncher
        run: |
          set -e
          mkdir -p turtle/ZalithLauncher/src/main/jniLibs/arm64-v8a
          found=0
          # Filter to paths that mention arm64/aarch64, since the script builds
          # all 4 Android arches - only arm64 is used by this app.
          while IFS= read -r f; do
            if echo "$f" | grep -qiE "arm64|aarch64"; then
              echo "Copying $f"
              cp "$f" turtle/ZalithLauncher/src/main/jniLibs/arm64-v8a/
              found=1
            fi
          done < <(find lwjgl3/bin -type f \( -name "liblwjgl.so" -o -name "liblwjgl_sdl.so" \))
          if [ "$found" -eq 0 ]; then
            echo "::error::No arm64 liblwjgl.so/liblwjgl_sdl.so found - build output layout may differ from expected, check the 'Locate the new native libs' step above and adjust the path filter."
            exit 1
          fi
          ls -la turtle/ZalithLauncher/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        working-directory: turtle
        run: chmod +x gradlew

      # Same reasoning as the existing Auto Build workflow: gradle.properties
      # pins aapt2 to a Termux-only path that doesn't exist on this runner.
      - name: Remove Termux-only aapt2 override for CI
        working-directory: turtle
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Build debug APK with the fixed native lib
        working-directory: turtle
        run: |
          ./gradlew :ZalithLauncher:assembleDebug \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs=-Xmx4g \
            --no-daemon

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: TurtleLauncher-debug-apk-lwjgl-fixed
          path: turtle/ZalithLauncher/build/outputs/apk/debug/*.apk
