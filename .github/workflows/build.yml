name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Works whether gradlew lives at the repo root or one level down
      # (e.g. TurtleLauncher/gradlew) - no need to hardcode the layout.
      - name: Locate the Android project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew | head -n1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found anywhere in this repo (checked 3 levels deep)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_DIR"

          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oE 'gradle-[0-9.]+-(bin|all)' "$PROPS" | head -n1 | sed -E 's/gradle-([0-9.]+)-(bin|all)/\1/')
          fi
          VERSION=${VERSION:-8.9}
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Gradle version: $VERSION"

      # Fixes: "Could not find or load main class org.gradle.wrapper.GradleWrapperMain"
      # That error means gradle/wrapper/gradle-wrapper.jar is missing, empty, or corrupt
      # in the repo - common with GitHub's web "Add files via upload" flow, which can
      # silently drop or mangle binary files. Rather than debug how it got lost, this
      # provisions a real Gradle install and has it write a fresh, correct wrapper jar
      # before gradlew is ever invoked, so the build no longer depends on whatever
      # actually made it into the repo.
      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Regenerate the Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        # The wrapper jar is tracked in the repo, so this step is only a repair for a missing
        # or corrupt one. If it cannot run (offline distribution, plugin lookup), carry on:
        # the actual build below uses ./gradlew and reports the real error if the jar were
        # genuinely broken, instead of failing here with a message about the wrapper.
        run: |
          gradle wrapper --gradle-version ${{ steps.locate.outputs.gradle_version }} \
            || echo "::warning::Could not regenerate the Gradle wrapper jar - using the one in the repo."


      # The Termux build pins aapt2 to a Termux-only ARM64 binary path that doesn't
      # exist on a normal Linux runner. Strip it so AGP falls back to the standard
      # aapt2 pulled from Google's Maven repo. Harmless no-op if the line isn't there.
      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' "${{ steps.locate.outputs.dir }}/gradle.properties" || true

      # gradle.properties is tuned for a phone: a 1 GB daemon heap and a single worker, with
      # parallel builds and the build cache off. A CI runner has 4 cores and 16 GB, and
      # packaging four ABIs of native libraries plus the assets with one worker is by far the
      # slowest part of a release build. These overrides are applied here, to the runner's
      # copy only - local and Termux builds keep the checked-in settings.
      - name: Tune Gradle for the runner
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i '/^org.gradle.workers.max=/d;/^org.gradle.parallel=/d;/^org.gradle.jvmargs=/d;/^org.gradle.configuration-cache=/d' gradle.properties
          printf '\n# CI overrides (see the "Tune Gradle for the runner" step)\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.configuration-cache=false\n' >> gradle.properties
          grep -E '^org.gradle' gradle.properties

      - name: Grant execute permission to gradlew
        run: chmod +x "${{ steps.locate.outputs.dir }}/gradlew"

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Baked into BuildConfig.GEMINI_API_KEY by build.gradle.kts, so the APK ships with
          # Turtle AI working and no key to paste. Add it under
          # Settings -> Secrets and variables -> Actions -> New repository secret, named
          # GEMINI_API_KEY. Missing secret = empty key = the app falls back to asking the user
          # (the build still succeeds).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The launcher's release keystore (endiq-key.jks) is in the repo; this is its
          # password. Without it the build still succeeds, signed with the debug keystore.
          ENDIQ_KEYSTORE_PASSWORD: ${{ secrets.ENDIQ_KEYSTORE_PASSWORD }}
          # Read by build.gradle.kts for InfoDistributor.BUILD_TYPE, which decides whether the
          # app considers itself a release build (ZHTools.isRelease/isDebug/isPreRelease).
          ZL_BUILD_TYPE: RELEASE
        run: |
          set -o pipefail
          # Prefer the repo's wrapper, but fall back to the provisioned Gradle if the
          # tracked wrapper jar is unusable - a broken wrapper should not decide whether
          # the launcher can be built.
          GRADLE_CMD=./gradlew
          if ! $GRADLE_CMD --version >/dev/null 2>&1; then
            echo "::warning::./gradlew is not usable - building with the provisioned Gradle instead."
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD :TurtleLauncher:assembleRelease --no-daemon --stacktrace 2>&1 \
            | tee /tmp/gradle-build.log

      # The raw job log is a separate download and can be unreachable from a restricted
      # network, so the errors are repeated as annotations on the run itself.
      - name: Report the build failure
        if: failure()
        run: |
          LOG=/tmp/gradle-build.log
          if [ ! -f "$LOG" ]; then
            echo "::error title=Gradle build failed::No build output was captured."
            exit 0
          fi
          ERRORS=$(grep -E "^e: |^w: .*error|error:|FAILURE:|What went wrong|Caused by:|Execution failed for task|> Task .*FAILED" "$LOG" | head -40 || true)
          # assembleRelease also runs lintVitalRelease, whose findings are in its own report
          # rather than in the Gradle output.
          for REPORT in $(find . -name "lint-results*.txt" -o -name "lint-results*.xml" 2>/dev/null | head -3); do
            echo "----- $REPORT -----"
            LINTS=$(grep -E "Error|Fatal|severity=\"(Fatal|Error)\"" "$REPORT" | head -20 || true)
            echo "$LINTS"
            ERRORS=$(printf '%s\n%s' "$ERRORS" "$LINTS")
          done
          if [ -z "$ERRORS" ]; then ERRORS=$(tail -40 "$LOG"); fi
          echo "----- captured errors -----"
          printf '%s\n' "$ERRORS"
          ESCAPED=$(printf '%s' "$ERRORS" | head -c 20000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::$ESCAPED"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-release-apk
          path: "**/build/outputs/apk/release/*.apk"
