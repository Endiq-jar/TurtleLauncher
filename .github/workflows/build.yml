name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, x86, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate the Android project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew | head -n1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found anywhere in this repo (checked 3 levels deep)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_DIR"

          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oE 'gradle-[0-9.]+-(bin|all)' "$PROPS" | head -n1 | sed -E 's/gradle-([0-9.]+)-(bin|all)/\1/')
          fi
          VERSION=${VERSION:-8.9}
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Gradle version: $VERSION"

      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Regenerate the Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version ${{ steps.locate.outputs.gradle_version }}

      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' "${{ steps.locate.outputs.dir }}/gradle.properties" || true

      - name: Grant execute permission to gradlew
        run: chmod +x "${{ steps.locate.outputs.dir }}/gradlew"

      - name: Set up Android SDK (sdkmanager on PATH)
        uses: android-actions/setup-android@v3
        with:
          # Do NOT let the action install its default 'tools platform-tools' packages
          # and accept licenses itself. Its bundled/old sdkmanager chokes on current
          # Google SDK repo metadata (XML v4) and dies mid-download with "Error on
          # ZipFile unknown archive" - the actual cause of the arm64 job failing at
          # "Set up Android SDK" in recent runs. platform-tools is already on the
          # hosted-runner image, and the next step installs exactly the packages this
          # build needs (with retries) using whatever sdkmanager the action put on PATH.
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept SDK licenses and install pinned SDK/NDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          attempts=0
          until sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 3 ]; then
              echo "::error::sdkmanager failed ${attempts} times to install platforms;android-36 / build-tools;36.0.0 / ndk;25.2.9519653"
              exit 1
            fi
            echo "sdkmanager install failed (attempt ${attempts}/3), retrying in 15s…"
            sleep 15
          done

      - name: Build debug APK (${{ matrix.arch }})
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./gradlew :ZalithLauncher:assembleDebug -Darch=${{ matrix.arch }} --no-daemon

      - name: Upload debug APK (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: TurtleLauncher-debug-apk-${{ matrix.arch }}
          path: "**/build/outputs/apk/debug/*.apk"
