name: ZZ Debug Build (temporary diagnostics)

# TEMPORARY - diagnostic-only workflow used to capture the real Gradle failure output
# from CI while the actions log endpoint is unreachable. Delete once the build is fixed.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate the Android project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew | head -n1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oE 'gradle-[0-9.]+-(bin|all)' "$PROPS" | head -n1 | sed -E 's/gradle-([0-9.]+)-(bin|all)/\1/')
          fi
          VERSION=${VERSION:-8.9}
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Regenerate the Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version ${{ steps.locate.outputs.gradle_version }}

      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' "${{ steps.locate.outputs.dir }}/gradle.properties" || true

      - name: Dump context
        run: |
          echo "=== root gradle.properties ==="
          cat "${{ steps.locate.outputs.dir }}/gradle.properties" || true
          echo "=== module gradle.properties ==="
          cat "${{ steps.locate.outputs.dir }}/ZalithLauncher/gradle.properties" || true
          echo "=== git log -1 ==="
          git log -1 --oneline

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          ./gradlew :ZalithLauncher:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" | tee -a /tmp/exitcode.txt

      - name: Expose failure summary as annotations
        if: always()
        shell: bash
        run: bash .github/scripts/annotate_log.sh /tmp/build.log

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-log
          path: /tmp/build.log
          if-no-files-found: warn
          retention-days: 1
