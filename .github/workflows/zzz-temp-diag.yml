# TEMPORARY - diagnostic only, deleted before this branch is merged.
#
# The normal "Build APK" workflow reports only "Process completed with exit code 1",
# which is useless for finding what actually broke. This runs the same build but
# captures the Gradle log and re-emits the real compiler errors as check-run
# annotations, so they can be read back through the API.
name: Temp build diagnostics

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate the Android project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew | head -n1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -oE 'gradle-[0-9.]+-(bin|all)' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" 2>/dev/null | head -n1 | sed -E 's/gradle-([0-9.]+)-(bin|all)/\1/')
          echo "gradle_version=${VERSION:-8.9}" >> "$GITHUB_OUTPUT"

      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Regenerate the Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version ${{ steps.locate.outputs.gradle_version }}

      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' "${{ steps.locate.outputs.dir }}/gradle.properties" || true

      - name: Grant execute permission to gradlew
        run: chmod +x "${{ steps.locate.outputs.dir }}/gradlew"

      - name: Build debug APK (capturing full log)
        id: build
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        continue-on-error: true
        run: |
          ./gradlew :ZalithLauncher:assembleDebug --no-daemon > "$GITHUB_WORKSPACE/build.log" 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Emit real errors as annotations
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::build.log was never created - build step did not run"
            exit 0
          fi

          echo "::group::extracting"
          {
            echo "===== EXIT: ${{ steps.build.outputs.exit }} ====="
            echo "--- compiler errors (Kotlin 'e:' / javac 'error:') ---"
            grep -E "^e: |error:|error$|Unresolved reference|Caused by:" "$LOG" | head -60
            echo "--- failed tasks ---"
            grep -E "^> Task .*FAILED|Execution failed for task" "$LOG" | head -20
            echo "--- what went wrong ---"
            awk '/\* What went wrong:/{f=1} f{print; n++} n>30{exit}' "$LOG"
            echo "--- tail ---"
            tail -25 "$LOG"
          } > "$GITHUB_WORKSPACE/errors.txt"
          echo "::endgroup::"

          echo "Extracted $(wc -l < "$GITHUB_WORKSPACE/errors.txt") lines"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            printf '::error::%s\n' "$line"
          done < "$GITHUB_WORKSPACE/errors.txt"
